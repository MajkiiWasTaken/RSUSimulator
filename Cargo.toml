[package]
name = "RSUSimulator"
version = "0.1.0"
authors = ["Michal Švrček"]
edition = "2024"

[dependencies]

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rand = "0.9"

tracing = "0.1"
tracing-subscriber = "0.3"